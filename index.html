<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR & Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;

<body>

<div class="container">

  <div class="card">

    <h2>QR & Barcode Scanner</h2>

    <div class="subtitle">
      Scan QR codes and normal product barcodes
    </div>


    <!-- RESULT ABOVE CAMERA -->

    <div class="result">

      <div class="result-title">
        Latest Scan
      </div>

      <div class="row">
        <div class="label">Scanned Value</div>
        <div class="value" id="codeValue">
          No code scanned
        </div>
      </div>

      <div class="row">
        <div class="label">Code Format</div>
        <div class="value" id="codeFormat">
          -
        </div>
      </div>

      <div class="row">
        <div class="label">Content Type</div>
        <div class="value" id="contentType">
          -
        </div>
      </div>

    </div>


    <div class="info-box" id="infoBox">

      <div class="label">
        Additional Information
      </div>

      <div id="additionalInfo"></div>

    </div>


    <div class="buttons">

      <button id="startBtn" onclick="startScanner()">
        Start
      </button>

      <button id="stopBtn" onclick="stopScanner()">
        Stop
      </button>

      <button id="clearBtn" onclick="clearResult()">
        Clear
      </button>

    </div>


    <div class="status" id="status">
      Scanner not started
    </div>


    <!-- CAMERA BELOW RESULT -->

    <div id="reader"></div>

  </div>

</div>


<script>

let scanner = null;
let lastScannedValue = "";
let scanning = false;


function startScanner() {

  if (scanning) {
    return;
  }

  scanner = new Html5Qrcode("reader");

  const config = {

    fps: 10,

    qrbox: function(viewfinderWidth, viewfinderHeight) {

      let width = Math.floor(viewfinderWidth * 0.85);

      let height = Math.floor(width * 0.45);

      return {
        width: width,
        height: height
      };
    },

    aspectRatio: 1.333334
  };


  scanner.start(

    {
      facingMode: "environment"
    },

    config,

    onScanSuccess,

    function(errorMessage) {
      // Ignore frame scan errors
    }

  )

  .then(function() {

    scanning = true;

    document.getElementById("status").innerText =
      "Scanner active - point camera at code";

  })

  .catch(function(error) {

    document.getElementById("status").innerText =
      "Camera error: " + error;

  });

}



function onScanSuccess(decodedText, decodedResult) {

  if (decodedText === lastScannedValue) {
    return;
  }

  lastScannedValue = decodedText;


  let format = "Unknown";

  try {

    if (
      decodedResult &&
      decodedResult.result &&
      decodedResult.result.format
    ) {

      format =
        decodedResult.result.format.formatName ||
        decodedResult.result.format.toString();

    }

  } catch(error) {
    console.log(error);
  }


  document.getElementById("codeValue").innerText =
    decodedText;

  document.getElementById("codeFormat").innerText =
    format;


  analyseContent(decodedText, format);


  document.getElementById("status").innerText =
    "Code scanned successfully";


  /*
   Optional vibration feedback
  */

  if (navigator.vibrate) {
    navigator.vibrate(120);
  }

}



function analyseContent(value, format) {

  const contentType =
    document.getElementById("contentType");

  const infoBox =
    document.getElementById("infoBox");

  const info =
    document.getElementById("additionalInfo");


  info.innerHTML = "";
  infoBox.style.display = "block";


  if (
    value.startsWith("http://") ||
    value.startsWith("https://")
  ) {

    contentType.innerText = "Website / URL";

    info.innerHTML = `
      <div class="info-line">
        <span class="info-label">Website:</span><br>
        <a href="${escapeHtml(value)}"
           target="_blank">
          ${escapeHtml(value)}
        </a>
      </div>
    `;

    return;
  }


  if (value.toLowerCase().startsWith("mailto:")) {

    contentType.innerText = "Email";

    const email =
      value.substring(7);

    info.innerHTML = `
      <div class="info-line">
        <span class="info-label">Email:</span>
        ${escapeHtml(email)}
      </div>
    `;

    return;
  }


  if (value.toLowerCase().startsWith("tel:")) {

    contentType.innerText = "Phone Number";

    const number =
      value.substring(4);

    info.innerHTML = `
      <div class="info-line">
        <span class="info-label">Phone:</span>
        ${escapeHtml(number)}
      </div>
    `;

    return;
  }


  if (value.startsWith("WIFI:")) {

    contentType.innerText = "Wi-Fi Network";

    const wifi =
      parseWifiQR(value);

    info.innerHTML = `
      <div class="info-line">
        <span class="info-label">Network:</span>
        ${escapeHtml(wifi.ssid || "Not available")}
      </div>

      <div class="info-line">
        <span class="info-label">Security:</span>
        ${escapeHtml(wifi.type || "Not available")}
      </div>

      <div class="info-line">
        <span class="info-label">Password:</span>
        ${escapeHtml(wifi.password || "Not available")}
      </div>
    `;

    return;
  }


  if (value.toLowerCase().startsWith("geo:")) {

    contentType.innerText = "Location";

    info.innerHTML = `
      <div class="info-line">
        <span class="info-label">Coordinates:</span>
        ${escapeHtml(value.substring(4))}
      </div>
    `;

    return;
  }


  if (
    value.toLowerCase().startsWith("sms:") ||
    value.toLowerCase().startsWith("smsto:")
  ) {

    contentType.innerText = "SMS";

    info.innerHTML = `
      <div class="info-line">
        ${escapeHtml(value)}
      </div>
    `;

    return;
  }


  if (
    value.toUpperCase().includes("BEGIN:VCARD")
  ) {

    contentType.innerText =
      "Contact / VCard";

    info.innerHTML = `
      <pre style="
        white-space:pre-wrap;
        word-break:break-word;
        margin:0;
      ">${escapeHtml(value)}</pre>
    `;

    return;
  }


  if (/^\d+$/.test(value)) {

    contentType.innerText =
      "Numeric Barcode / Product Code";

    let standard = "Unknown / Generic";

    if (value.length === 13) {
      standard = "EAN-13 / GTIN-13";
    }

    else if (value.length === 12) {
      standard = "UPC-A / GTIN-12";
    }

    else if (value.length === 8) {
      standard = "EAN-8";
    }


    info.innerHTML = `

      <div class="info-line">
        <span class="info-label">
          Barcode Number:
        </span>
        ${escapeHtml(value)}
      </div>

      <div class="info-line">
        <span class="info-label">
          Digits:
        </span>
        ${value.length}
      </div>

      <div class="info-line">
        <span class="info-label">
          Likely Standard:
        </span>
        ${standard}
      </div>

      <div style="
        font-size:12px;
        color:#666;
        margin-top:8px;
      ">
        Product name, brand, pack size and MRP normally require a database lookup.
      </div>
    `;

    return;
  }


  contentType.innerText =
    "Text / Encoded Data";

  info.innerHTML = `
    <div class="info-line">
      ${escapeHtml(value)}
    </div>
  `;

}



function parseWifiQR(value) {

  const result = {};

  value = value.replace(/^WIFI:/, "");

  const sections = value.split(";");

  sections.forEach(function(section) {

    if (section.startsWith("S:")) {
      result.ssid = section.substring(2);
    }

    else if (section.startsWith("T:")) {
      result.type = section.substring(2);
    }

    else if (section.startsWith("P:")) {
      result.password = section.substring(2);
    }

  });

  return result;

}



function stopScanner() {

  if (!scanner || !scanning) {
    return;
  }

  scanner.stop()

  .then(function() {

    scanning = false;

    document.getElementById("status").innerText =
      "Scanner stopped";

  })

  .catch(function(error) {
    console.log(error);
  });

}



function clearResult() {

  lastScannedValue = "";

  document.getElementById("codeValue").innerText =
    "No code scanned";

  document.getElementById("codeFormat").innerText =
    "-";

  document.getElementById("contentType").innerText =
    "-";

  document.getElementById("additionalInfo").innerHTML =
    "";

  document.getElementById("infoBox").style.display =
    "none";

}



function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}

</script>

</body>
</html>
